name: Validate Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example 2026.06.12 or 2026.06.12.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-native:
    name: Validate ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: mytool-linux-x64
            os: ubuntu-latest
          - asset: mytool-linux-arm64
            os: ubuntu-24.04-arm
          - asset: mytool-darwin-arm64
            os: macos-15
    env:
      TAG: ${{ inputs.tag }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi

      - name: Download and verify asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets/$ASSET"
          mkdir -p "$asset_dir"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --pattern SHA256SUMS \
            --dir "$asset_dir" \
            --clobber

          test -s "$asset_dir/$ASSET"
          test -s "$asset_dir/SHA256SUMS"
          (
            cd "$asset_dir"
            grep -E "[[:space:]]\*?$ASSET$" SHA256SUMS > SHA256SUMS.one
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c SHA256SUMS.one
            else
              shasum -a 256 -c SHA256SUMS.one
            fi
            chmod 0755 "$ASSET"
          )

          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Run release smoke
        shell: bash
        run: |
          set -euo pipefail
          MYTOOL_BIN="${{ steps.release.outputs.asset_dir }}/$ASSET" \
            EXPECTED_VERSION="$TAG" \
            MYTOOL_SMOKE_ROOT="$RUNNER_TEMP/smoke/$ASSET" \
            MYTOOL_SMOKE_DIAG_DIR="$RUNNER_TEMP/diagnostics/$ASSET" \
            scripts/smoke-release-asset.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-smoke-${{ matrix.asset }}-${{ matrix.os }}-diagnostics
          path: |
            ${{ runner.temp }}/diagnostics/${{ matrix.asset }}
            ${{ runner.temp }}/smoke/${{ matrix.asset }}
          if-no-files-found: ignore
          retention-days: 14

  validate-linux-musl:
    name: Validate ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: mytool-linux-x64-musl
            image: alpine:3.20
    env:
      TAG: ${{ inputs.tag }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi

      - name: Download and verify asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets/$ASSET"
          mkdir -p "$asset_dir"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --pattern SHA256SUMS \
            --dir "$asset_dir" \
            --clobber

          test -s "$asset_dir/$ASSET"
          test -s "$asset_dir/SHA256SUMS"
          (
            cd "$asset_dir"
            grep -E "[[:space:]]\*?$ASSET$" SHA256SUMS > SHA256SUMS.one
            sha256sum -c SHA256SUMS.one
            chmod 0755 "$ASSET"
          )

          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Run Alpine release smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostics/$ASSET"

          docker run --rm \
            -e RELEASE_ASSET="/release/$ASSET" \
            -e EXPECTED_VERSION="$TAG" \
            -e MYTOOL_SMOKE_ROOT="/tmp/mytool-smoke/$ASSET" \
            -e MYTOOL_SMOKE_DIAG_DIR="/diagnostics" \
            -v "${{ steps.release.outputs.asset_dir }}:/release:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$RUNNER_TEMP/diagnostics/$ASSET:/diagnostics" \
            ${{ matrix.image }} \
            sh -euxc '
              apk add --no-cache bash coreutils libstdc++
              cp "$RELEASE_ASSET" /tmp/mytool
              chmod 0755 /tmp/mytool
              MYTOOL_BIN=/tmp/mytool /scripts/smoke-release-asset.sh
            '

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-smoke-mytool-linux-x64-musl-alpine-diagnostics
          path: |
            ${{ runner.temp }}/diagnostics/mytool-linux-x64-musl
          if-no-files-found: ignore
          retention-days: 14
