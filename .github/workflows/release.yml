name: Release

on:
  push:
    tags:
      - '20[0-9][0-9].*'

# Default to read-only; every job that touches the release elevates to
# contents: write explicitly. Binaries travel between jobs as assets on a DRAFT
# GitHub Release (not actions/{upload,download}-artifact, so the account's
# Actions artifact-storage quota cannot block a release). Draft releases are
# invisible to read-only tokens, so each job that reads or writes the draft
# needs contents: write. The token is passed only to the steps that call gh, and
# checkouts do not persist credentials.
permissions:
  contents: read

# One release run per tag at a time; never cancel a run that may be publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi
          # Notes always come from the CHANGELOG section for the tag. The
          # extractor fails if the section is missing or empty, so a missing
          # changelog entry blocks the release before anything builds, and a
          # reused draft gets its notes refreshed from CHANGELOG.
          scripts/extract-changelog-section.sh "$TAG" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          # Reuse an existing release ONLY while it is a draft (left by an
          # earlier failed attempt). A PUBLISHED release is refused: re-running
          # would upload fresh binaries over public assets before validation.
          # Re-cutting a published release requires deleting it first.
          # Only an explicit "release not found" means "create"; any other
          # lookup failure (network, 5xx, rate limit) fails closed rather than
          # risking a second draft for the same tag.
          if existing_is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/view.err")"; then
            if [ "$existing_is_draft" != "true" ]; then
              echo "::error::release $TAG already exists and is published; refusing to re-run (it would replace public assets). Delete the release to re-cut it."
              exit 1
            fi
            echo "Reusing existing draft release for $TAG; refreshing notes from CHANGELOG."
            gh release edit "$TAG" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          elif grep -qx 'release not found' "$RUNNER_TEMP/view.err"; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            echo "::error::could not determine whether release $TAG exists: $(cat "$RUNNER_TEMP/view.err")"
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: mytool-linux-x64
          - target: bun-linux-arm64
            asset: mytool-linux-arm64
          - target: bun-darwin-arm64
            asset: mytool-darwin-arm64
          - target: bun-linux-x64-musl
            asset: mytool-linux-x64-musl
    env:
      ASSET: ${{ matrix.asset }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Assert release is still a draft
        # Fail fast on a selected re-run of this job after publication, before
        # spending time on a build that could never be uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::release $TAG is already published; refusing to rebuild an asset for it. Delete the release to re-cut it."
            exit 1
          fi
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - name: Build stamped binary
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi
          mkdir -p dist
          bun build src/index.ts --compile --target="$TARGET" --define "process.env.MYTOOL_VERSION=\"$VERSION\"" --outfile "dist/$ASSET"
          chmod +x "dist/$ASSET"
          if [ "$TARGET" = "bun-linux-x64" ]; then
            test "$("./dist/$ASSET" --version)" = "$VERSION"
          fi
      - name: Upload binary to draft release
        # --clobber lets a re-run of a failed attempt replace its own draft
        # asset. The draft check runs immediately before the upload, so a
        # published release is never modified.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::release $TAG is already published; refusing to upload $ASSET over a public asset."
            exit 1
          fi
          gh release upload "$TAG" "dist/$ASSET" --clobber

  validate-native:
    name: Validate ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: [create-release, build]
    permissions:
      # write is load-bearing: a draft release is invisible to read-only tokens,
      # so downloading the draft asset needs push access. Do not tighten to read.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: mytool-linux-x64
            os: ubuntu-latest
          - asset: mytool-linux-arm64
            os: ubuntu-24.04-arm
          - asset: mytool-darwin-arm64
            os: macos-15
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi

      - name: Download release asset from draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p "$ASSET" -D "$RUNNER_TEMP/release-assets/$ASSET" --clobber

      - name: Verify build artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets/$ASSET"
          asset_path="$asset_dir/$ASSET"
          version="${TAG#v}"

          test -s "$asset_path"
          chmod 0755 "$asset_path"
          test "$("$asset_path" --version)" = "$version"
          "$asset_path" --help >/dev/null

          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Run release smoke
        shell: bash
        run: |
          set -euo pipefail
          MYTOOL_BIN="${{ steps.artifact.outputs.asset_dir }}/$ASSET" \
            EXPECTED_VERSION="$TAG" \
            MYTOOL_SMOKE_ROOT="$RUNNER_TEMP/smoke/$ASSET" \
            MYTOOL_SMOKE_DIAG_DIR="$RUNNER_TEMP/diagnostics/$ASSET" \
            scripts/smoke-release-asset.sh

      - name: Dump smoke diagnostics to job summary
        # Job summary instead of upload-artifact (also quota-bound). Best-effort.
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "## Smoke diagnostics — $ASSET (${{ matrix.os }})"
            for d in "$RUNNER_TEMP/diagnostics/$ASSET" "$RUNNER_TEMP/smoke/$ASSET/output"; do
              [ -d "$d" ] || continue
              find "$d" -type f | while IFS= read -r f; do
                echo "<details><summary>$f</summary>"
                echo
                echo '```'
                tail -c 20000 "$f"
                echo
                echo '```'
                echo "</details>"
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  validate-linux-musl:
    name: Validate ${{ matrix.asset }}
    runs-on: ubuntu-latest
    needs: [create-release, build]
    permissions:
      # write is load-bearing: see validate-native.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: mytool-linux-x64-musl
            image: alpine:3.20
    env:
      ASSET: ${{ matrix.asset }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi

      - name: Download release asset from draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p "$ASSET" -D "$RUNNER_TEMP/release-assets/$ASSET" --clobber

      - name: Run Alpine release smoke
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets/$ASSET"
          test -s "$asset_dir/$ASSET"
          mkdir -p "$RUNNER_TEMP/diagnostics/$ASSET"

          docker run --rm \
            -e RELEASE_ASSET="/release/$ASSET" \
            -e EXPECTED_VERSION="$TAG" \
            -e MYTOOL_SMOKE_ROOT="/tmp/mytool-smoke/$ASSET" \
            -e MYTOOL_SMOKE_DIAG_DIR="/diagnostics" \
            -v "$asset_dir:/release:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$RUNNER_TEMP/diagnostics/$ASSET:/diagnostics" \
            "$IMAGE" \
            sh -euxc '
              apk add --no-cache bash coreutils libstdc++
              test -s "$RELEASE_ASSET"
              cp "$RELEASE_ASSET" /tmp/mytool
              chmod 0755 /tmp/mytool
              test "$(/tmp/mytool --version)" = "${EXPECTED_VERSION#v}"
              /tmp/mytool --help >/dev/null
              MYTOOL_BIN=/tmp/mytool /scripts/smoke-release-asset.sh
            '

      - name: Dump smoke diagnostics to job summary
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/diagnostics/$ASSET"
          {
            echo "## Smoke diagnostics — $ASSET (alpine)"
            [ -d "$d" ] && find "$d" -type f | while IFS= read -r f; do
              echo "<details><summary>$f</summary>"
              echo
              echo '```'
              tail -c 20000 "$f"
              echo
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-native, validate-linux-musl]
    permissions:
      contents: write
    # Serialize publishing across ALL tags of this repository (the workflow-level
    # group above is per tag), so two releases cannot both read the same old
    # "Latest" and publish in the wrong order; the Latest decision is made
    # inside this boundary. GitHub keeps at most one running and one pending job
    # per group: if a third publish queues behind a pending one, the older
    # pending job is cancelled and its release stays a draft until that job is
    # re-run.
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      # The exact release binaries; must match the build matrix `asset` values
      # (test/release-scripts.test.ts enforces this). Enumerated, not globbed,
      # so a polluted draft cannot inject assets into SHA256SUMS or the release.
      ASSETS: mytool-darwin-arm64 mytool-linux-arm64 mytool-linux-x64 mytool-linux-x64-musl
    steps:
      - name: Assert release is still a draft
        # Fail closed before anything else: a selected re-run of this job after a
        # successful publish must not touch the public release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::release $TAG is already published; refusing to re-run the publish job (it would modify public assets). Delete the release to re-cut it."
            exit 1
          fi
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install security scanners
        run: scripts/install-security-tools.sh
      - name: Generate and scan release SBOM
        run: |
          set -euo pipefail
          trivy fs --format cyclonedx --include-dev-deps --output sbom.cdx.json .
          trivy sbom sbom.cdx.json --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Download validated binaries from draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -ra assets <<< "$ASSETS"
          mkdir -p dist
          for asset in "${assets[@]}"; do
            gh release download "$TAG" -p "$asset" -D dist --clobber
          done
      - name: Create SHA256SUMS
        run: |
          set -euo pipefail
          read -ra assets <<< "$ASSETS"
          mv sbom.cdx.json dist/sbom.cdx.json
          cd dist
          sha256sum "${assets[@]}" sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS
      - name: Upload SBOM and checksums to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          gh release upload "$TAG" sbom.cdx.json SHA256SUMS --clobber
      - name: Verify exact draft asset set
        # Publishing flips every attached asset public at once; fail closed (no
        # auto-delete) on anything missing or extra so a human inspects it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -ra assets <<< "$ASSETS"
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | scripts/verify-release-assets.sh "${assets[@]}" sbom.cdx.json SHA256SUMS
      - name: Publish release
        # Flip the draft public only after every validation job and the SBOM
        # scan passed. "Latest" (what install.sh's `latest` resolves to) moves
        # unless an already-published release has a higher CalVer, so a late
        # backport tag does not take it over. If the current Latest cannot be
        # determined (API error, auth/rate limit), the decision script fails and
        # the release stays a draft — re-run this job once GitHub recovers.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::refusing to publish non-CalVer tag: $TAG"
            exit 1
          fi
          make_latest="$(scripts/release-latest.sh "$TAG")"
          gh release edit "$TAG" --draft=false --latest="$make_latest"
          echo "make_latest=$make_latest" >> "$GITHUB_ENV"
      - name: Read back published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -ra assets <<< "$ASSETS"
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false"
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | scripts/verify-release-assets.sh "${assets[@]}" sbom.cdx.json SHA256SUMS
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
          if [ "$make_latest" = true ]; then
            test "$latest" = "$TAG" || { echo "::error::expected $TAG to be Latest, found $latest"; exit 1; }
          else
            test "$latest" != "$TAG" || { echo "::error::$TAG became Latest although a newer release exists"; exit 1; }
          fi
          echo "Latest is $latest"
