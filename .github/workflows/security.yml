name: Dependency Security

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main, "epic/**"]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency scan (reporting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Verify lockfile form
        run: test -f bun.lock && ! test -f bun.lockb
      - name: Install security scanners
        run: scripts/install-security-tools.sh
      - name: OSV-Scanner lockfile scan
        continue-on-error: true
        run: osv-scanner scan source --lockfile=bun.lock --config=osv-scanner.toml --format=sarif > osv-results.sarif
      - name: Trivy filesystem scan
        continue-on-error: true
        run: trivy fs --scanners vuln --include-dev-deps --ignorefile .trivyignore.yaml --format sarif --output trivy-results.sarif .
      # Best-effort: this job only REPORTS (the blocking signal is the separate
      # security-gate job). The SARIF upload must never fail the reporting job —
      # e.g. when the account's Actions artifact-storage quota is exhausted — so
      # it is continue-on-error in addition to if: always().
      - name: Upload security scan reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-security-reports
          path: |
            osv-results.sarif
            trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 14

  security-gate:
    name: HIGH/CRITICAL fixable gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Verify lockfile form
        run: test -f bun.lock && ! test -f bun.lockb
      - name: Install security scanners
        run: scripts/install-security-tools.sh
      - name: Block fixable high and critical vulnerabilities
        run: trivy fs --scanners vuln --include-dev-deps --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  license-policy:
    name: License policy flag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      # Licenses are read from the installed packages: bun.lock carries no
      # license metadata, so a lockfile-only scan would pass vacuously.
      - run: bun install --frozen-lockfile
      - name: Install security scanners
        run: scripts/install-security-tools.sh
      - name: Flag non-permissive or undetected dependency licenses for review
        # A policy flag, not a legal determination — see docs/security.md.
        run: bun run security:licenses
